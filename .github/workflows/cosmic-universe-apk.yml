name: Build Cosmic Universe TV APK

on:
  push:
    branches: [feat/cosmic-universe-freemytv-audit, feat/advanced-launcher-product-foundation]
    paths:
      - 'tv/cosmic-universe/**'
      - '.github/workflows/cosmic-universe-apk.yml'
  pull_request:
    paths:
      - 'tv/cosmic-universe/**'
      - '.github/workflows/cosmic-universe-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate bundled offline wallpaper resources
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p tv/cosmic-universe/app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("tv/cosmic-universe/wallpapers")
          target = Path("tv/cosmic-universe/app/src/main/res/drawable-nodpi")
          files = sorted(source.glob("*.svg"))
          if len(files) < 10:
              raise SystemExit(f"Expected 10 wallpapers, found {len(files)}")
          for svg in files:
              cairosvg.svg2png(url=str(svg), write_to=str(target / (svg.stem + ".png")), output_width=1920, output_height=1080)
          print(f"Generated {len(files)} offline 1920x1080 wallpaper resources")
          PY
      - name: Compile and package debug APK
        working-directory: tv/cosmic-universe
        run: gradle --no-daemon :app:assembleDebug :mobile:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-universe-tv-and-mobile-debug-apks
          path: |
            tv/cosmic-universe/app/build/outputs/apk/debug/app-debug.apk
            tv/cosmic-universe/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
