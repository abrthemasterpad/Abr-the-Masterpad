plugins {
    id 'com.android.application'
}

android {
    namespace 'io.causelane.cosmic'
    compileSdk 35

    defaultConfig {
        applicationId 'io.causelane.cosmic.masterpad'
        minSdk 26
        targetSdk 30
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Open-source local-network transport and QR encoding; no hosted API or account.
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.google.zxing:core:3.5.3'
}
