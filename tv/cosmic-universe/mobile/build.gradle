plugins {
    id 'com.android.application'
}

android {
    namespace 'io.causelane.cosmicremote'
    compileSdk 35

    defaultConfig {
        applicationId 'io.causelane.cosmicremote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

/*
 * Older Android scanner transitive metadata can pull the split Kotlin JDK7/JDK8
 * artifacts alongside the unified stdlib, causing duplicate-class packaging errors.
 * Kotlin 1.8+ includes these extensions in kotlin-stdlib.
 */
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
